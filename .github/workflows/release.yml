name: Release

# Push a tag such as v0.2.0 to build DteMcp.exe and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/DteMcp.Tests
      - name: Build
        run: dotnet build DteMcp.csproj -c Release
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $folder = "DteMcp-$version"
          New-Item -ItemType Directory -Path $folder | Out-Null
          Copy-Item bin/Release/net48/DteMcp.exe, LICENSE.txt, NOTICE, README.md, docs/TOOLS.md -Destination $folder
          Compress-Archive -Path "$folder/*" -DestinationPath "$folder.zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "DteMcp-*.zip" --title "${{ github.ref_name }}" --generate-notes
